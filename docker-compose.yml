# Local development services. Start: docker compose up -d   Stop: docker compose down
# name: ecommerce
services:
  storage:
    # SeaweedFS: S3-compatible object storage (weed mini = all-in-one dev mode)
    image: chrislusf/seaweedfs:4.48
    container_name: ecommerce-storage
    restart: unless-stopped
    environment:
      # Values come from .env, so the app and the storage always share the same keys
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    ports:
      - "127.0.0.1:8333:8333" # S3 API → http://localhost:8333
      - "127.0.0.1:23646:23646" # Admin UI → http://localhost:23646 (this computer only)
    volumes:
      - storage-data:/data # uploaded files survive container restarts

volumes:
  storage-data: