# MediaMTX configuration for the surveillance learning lab.
# Any setting not listed here falls back to MediaMTX defaults.

logLevel: info

# RTSP: cameras publish here, AI service and VLC read from here.
rtsp: yes
rtspAddress: :8554
# TCP only: inside Docker only TCP 8554 is mapped, so UDP RTP would silently fail.
rtspTransports: [tcp]

# HLS: browser playback (a few seconds of latency).
hls: yes
hlsAddress: :8888

# WebRTC: low-latency browser playback, used later in the frontend.
webrtc: no
webrtcAddress: :8889

# Protocols this lab does not use. Disabled to reduce attack surface and noise.
rtmp: no
srt: no
moq: no

#  Control PAI: the Node backend creates, updates and remove camera paths through it.
api: yes
apiAddress: :9997

# Who may do what. Least privilege: viewers and cameras never get "api",
# and the backend service user gets only "api".
authInternalUsers:
   # Cameras publish, viewers read. Open for now; locked down in the security step.
   - user: any
     pass:
     ips: []
     permissions:
       - action: publish
       - action: read
       - action: playback
   # Service user for the Node backend. The real password comes from the
   # MTX_AUTHINTERNALUSERS_1_PASS environment variable (see docker-compose.yml).
   - user: backend
     pass: set-via-env
     ips: []
     permissions:
       - action: api

paths:
  # Simulated camera devices: FFmpeg pushes here, like a real camera's own RTSP stream.
  # Viewer-facing paths (cam1, cam2, ...) are created by the backend through the API.
  fake1:
    source: publisher
  fake2:
    source: publisher
